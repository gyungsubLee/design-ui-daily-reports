s" aria-live="polite"></p><section id="favorites-list" aria-label="저장한 사이트 목록"></section><noscript>즐겨찾기를 사용하려면 JavaScript를 켜 주세요. 저장 데이터는 이 브라우저에만 보관됩니다.</noscript></main><script id="design-favorites-config" type="application/json">{"auth_redirect": "https://gyungsublee.github.io/design-ui-daily-reports/favorites.html", "supabase": {"url": "https://vhyuknllkthzwlmsmheo.supabase.co", "publishable_key": "sb_publishable_3OPQHVrwaM4i2jG9XQcZkw_fDYui_rp"}}</script><script id="design-favorites-script">(() => {
'use strict';
const KEY = 'design-field-notes:favorites:v1';

  if (sort && sort.value === 'rating') visible.sort((a,b) => (b.rating || 0) - (a.rating || 0));
  document.getElementById('favorites-count').textContent = `저장 ${items.length}개 · 표시 ${visible.length}개`;

    node('h2',item.title,card); node('p',`${item.source} · 출처 날짜 ${item.date || '불명'} · 보고서 ${item.report_date || '불명'}`,card);
    const links = document.createElement('div'); links.className = 'saved-links'; card.append(links);
    for (const [label,href] of [['실제 사이트 ↗',item.website_url],['출처 원문 ↗',item.source_url],['저장한 보고서 ↗',item.report_url]]) {
      const a = node('a',label,links); a.href = href; a.target = '_blank'; a.rel = 'noopener noreferrer';
    }

    rating.value = item.rating === null ? '' : String(item.rating); rating.disabled = !readable || busy; card.append(rating);
    rating.addEventListener('change',() => {
      const focused = document.activeElement === rating;
      const value = rating.value === '' ? null : Number(rating.value);
      if (read() && write(items.map(x => x.website_url === item.website_url ? {...x,rating:value} : x))) status.textContent = value === null ? '점수를 지웠습니다. 미평가로 저장했습니다.' : `${value}점으로 저장했습니다.`;
      render();

        if (replacement) replacement.focus(); else (filters.find(x => x.dataset.ratingFilter === ratingFilter) || search).focus();

    const button = node('button','즐겨찾기 삭제',card); button.type = 'button'; button.className = 'favorite-toggle'; button.setAttribute('aria-label',item.title+' 즐겨찾기 삭제'); button.addEventListener('click',() => remove(item.website_url));

}

const SESSION_KEY = 'design-field-notes:supabase-session:v1';
const publicCloud = config.supabase || {};

}
async function request(path, options = {}, token = null) {

}
function rowPath(website) {

}

  const all = [];

async function cloudWrite(next) {

  status.before(authPanel); accountLabel=node('p','',authPanel);
  loginForm=node('form','',authPanel); loginForm.id='favorites-login';
  const label=node('label','이메일 매직 링크 로그인 ',loginForm); emailInput=node('input','',label); emailInput.id='favorites-email'; emailInput.type='email'; emailInput.required=true; emailInput.autocomplete='email';
  const submit=node('button','로그인 링크 받기',loginForm); submit.type='submit';
  logoutButton=node('button','로그아웃',authPanel); logoutButton.id='favorites-logout'; logoutButton.type='button'; logoutButton.addEventListener('click',logout);
  refreshButton=node('button','클라우드 새로고침',authPanel); refreshButton.id='favorites-refresh'; refreshButton.type='button'; refreshButton.addEventListener('click',refreshCloud);
  importButton=node('button','이 브라우저 목록 가져오기 · 기존 클라우드 점수 유지',authPanel); importButton.id='favorites-import'; importButton.type='button'; importButton.addEventListener('click',importGuests);
  loginForm.addEventListener('submit',async event=>{

    const epoch=generation; submit.disabled=true; status.textContent='로그인 링크 요청 중…';
    try {

    } catch (_) { if(epoch===generation)status.textContent='로그인 링크 요청 실패 · 다시 시도하세요.'; }

  window.addEventListener('storage',event=>{
    if(event.key===SESSION_KEY || (event.key===null && cloudMode)) {

      status.textContent='다른 탭에서 계정이 변경되었습니다. 이 페이지를 다시 열어 로그인 상태를 확인하세요.'; render(); authUI();

      cloudMode=true; readable=false; items=[]; busy=true; render(); authUI();

      if (!validated || !validated.id) throw new Error('Invalid user'); user=validated;
      await readRemote(epoch); current(epoch); busy=false; status.textContent='로그인 및 클라우드 목록을 확인했습니다.'; render(); authUI();
    } else { read(); render(); authUI(); }
  } catch(error) {if(initialEpoch===generation){cloudMode=true; cloudError(error,initialEpoch);}}
}

for (const card of document.querySelectorAll('article.card')) {
  const visit = card.querySelector('.visit-link');
  const source = card.querySelector('.reference-links a:not(.visit-link)');
  const heading = card.querySelector('h2');
  const item = clean({title:heading ? heading.textContent.trim() : '', website_url:visit && visit.getAttribute('href'), source_url:source && source.getAttribute('href'), source:source ? source.textContent.replace(/\s*원문.*$/,'').trim() : '', date:card.getAttribute('data-date') || '', report_url:config.report_url, report_date:config.report_date});
  const button = document.createElement('button'); button.type = 'button'; button.className = 'favorite-toggle';
  if (!item) { button.textContent = '실제 사이트 주소 미확인 · 저장 불가'; button.disabled = true; card.append(button); continue; }
  const label = node('label','내 점수 · 선택하면 즐겨찾기에 저장 ',card); label.className = 'report-rating-label';
  const rating = document.createElement('select'); rating.className = 'favorite-rating report-rating'; rating.setAttribute('aria-label',item.title+' 점수'); rating.dataset.website = item.website_url;
  for (const [value,text] of [['','미평가'],['1','1점'],['2','2점'],['3','3점']]) { const option = node('option',text,rating); option.value = value; }
  label.append(rating);
  bindings.push({button,item,rating}); card.append(button);
  rating.addEventListener('change',() => {
    const value = rating.value === '' ? null : Number(rating.value);
    if (!read()) { render(); return; }
    if (value !== null && ![1,2,3].includes(value)) { render(); return; }
    const existing = items.find(x => x.website_url === item.website_url);
    const next = existing ? items.map(x => x.website_url === item.website_url ? {...x,rating:value} : x) : value === null ? items : [...items,{...item,rating:value}];
    if (write(next)) status.textContent = value === null ? '점수를 지웠습니다. 즐겨찾기는 유지됩니다.' : `${value}점으로 즐겨찾기에 저장했습니다.`;
    render();
  });
  button.addEventListener('click',() => {
    if (!read()) { render(); return; }
    const exists = items.some(x => x.website_url === item.website_url);
    const next = exists ? items.filter(x => x.website_url !== item.website_url) : [...items,item];
    if (write(next)) { status.textContent = exists ? '즐겨찾기에서 삭제했습니다.' : '이 브라우저에 저장했습니다.'; render(); }
  });
}
